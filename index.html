<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Take timestamped notes while watching YouTube videos. Paste a link, watch it, and export notes as PDF." />
    <meta name="theme-color" content="#7c3aed" />
    <title>YtEduNotes — Timestamped YouTube Notes</title>
    <!-- FOUC prevention: apply theme before first paint -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ytedunotes-theme');
          if (stored === 'dark') {
            document.documentElement.classList.add('dark');
          } else if (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        } catch (_) {}
      })();
    </script>
    <!-- Fonts: Cabinet Grotesk / Satoshi via Fontshare + Inter & Geist Mono via Google Fonts -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@700,800,900&f[]=satoshi@500,700,900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
